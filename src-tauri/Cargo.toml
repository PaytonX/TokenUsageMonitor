[package]
name = "token-usage-monitor"
version = "0.3.1"
description = "Lightweight transparent desktop widget for AI token usage monitoring"
authors = ["TokenUsageMonitor"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PaytonX/TokenUsageMonitor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_usage_monitor_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core. Features:
# - tray-icon / image-png: 常驻托盘 + PNG 图标（含 macOS 模板托盘图）
# - macos-private-api: macOS 透明窗依赖的私有 API；由 tauri.conf.json 的
#   app.macOSPrivateApi 声明并经 tauri-build 的 allowlist 校验，两处必须一致
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
# TokenRouter 本地反向代理：与 tokio/reqwest 同栈，承载 SSE 流式转发
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "5"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Credential storage via the OS credential manager. Two platform stores:
# Windows Credential Manager (DPAPI) and macOS login Keychain. The crate's
# platform deps are target-gated, so enabling both is cross-platform safe;
# missing the matching feature for a target leaves that platform with NO
# credential store (all providers permanently NotConfigured).
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# HMAC + SHA256 for Volcano signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CSPRNG for the hub shared secret (already present as a transitive
# dependency; declared directly because settings.rs uses it)
getrandom = "0.3"

# 语言 "auto" 的系统区域探测（i18n.rs system_lang）
sys-locale = "0.3"

# Errors
thiserror = "1"
anyhow = "1"

# Semver comparison for the GitHub Releases update check
semver = "1"

# Async trait
async-trait = "0.1"

# TOML config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.21.4"
zstd = "0.14.0"

[features]
# This feature is used for production builds or when `devUrl` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
