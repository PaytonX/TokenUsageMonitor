[package]
name = "token-usage-monitor"
version = "0.1.0"
description = "Lightweight transparent desktop widget for AI token usage monitoring"
authors = ["TokenUsageMonitor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_usage_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core - include features needed for transparent always-on-top window
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde", "clock"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Credential storage (Windows DPAPI via OS credential manager)
keyring = { version = "3", features = ["windows-native"] }

# HMAC + SHA256 for Volcano signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Errors
thiserror = "1"
anyhow = "1"

# Async trait
async-trait = "0.1"

# TOML config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# This feature is used for production builds or when `devUrl` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]
