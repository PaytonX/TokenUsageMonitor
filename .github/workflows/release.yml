name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 打包并发布（NSIS + MSI）
    runs-on: windows-latest
    env:
      # 与 ci.yml 同理：仓库根 rust-toolchain.toml 钉的是 GNU，那是本机开发的选择
      # （依赖用户级 winget 的 LLVM-MinGW + 手工硬链接的 as.exe）。GitHub runner
      # 上没有这套环境，GNU 链接无法工作。改用 runner 预装的 MSVC 工具链——
      # windows-latest 自带 VS Build Tools。
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      # tauri:build 会以 custom-protocol 生产模式出包（NSIS 由 Tauri 自动下载）
      - run: npm run tauri:build
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/
          Get-ChildItem dist-release
      # 为每个安装包生成 SHA256 校验和，供下载方核对来源完整性。
      # 清单需与安装包一起上传，且用 LF 行尾（保持与仓库 eol=lf 约定一致）。
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist-release -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Sort-Object Name
          if (-not $files) { throw 'no artifacts to checksum' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # 用 LF 写盘：Out-File 默认 CRLF，会让校验和在 Linux/macOS 上校验失败。
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'dist-release/SHA256SUMS.txt'),
            ($lines -join "`n") + "`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content dist-release/SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true

  build-macos:
    name: 打包并发布（macOS DMG，未签名）
    runs-on: macos-latest
    env:
      # rust-toolchain.toml 钉的 stable-x86_64-pc-windows-gnu 是 Windows 宿主
      # 工具链，macOS 上不可用；与 ci.yml 同理用 RUSTUP_TOOLCHAIN 覆盖。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # universal 二进制：arm64 runner 上补 x86_64 目标，产物同时覆盖
      # Apple Silicon 与 Intel Mac（调研文档 §7.1）。
      - run: rustup target add x86_64-apple-darwin
      - run: rustup show active-toolchain
      - run: npm ci
      # 未签名 DMG 是拍板项（开源直发）：无 APPLE_* secrets，Tauri 跳过签名
      # 与公证；下载侧的 Gatekeeper 绕过步骤写在 README（§安装说明）。
      - run: npm run tauri:build:mac
      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-release/
          ls -la dist-release
      # 校验和独立成 SHA256SUMS-macos.txt：与 Windows job 并行上传同一 Release，
      # 各自维护清单，避免两个 job 互相覆盖同一份汇总文件。
      - name: Generate checksums
        run: |
          cd dist-release
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
